# The TestFlight status (builds, beta review, tester groups – counts only) as annotations: push to the branch asc-status.
name: asc-status
on:
  push:
    branches: [asc-status]
  workflow_dispatch:
jobs:
  status:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pyjwt cryptography
      - run: python3 ios/ci/asc_status.py
