# Builds GolfOS as an iOS app and uploads it to TestFlight (Sascha 01.11.2026: no Mac – a Mac of GitHub builds and
# signs it). Without the Apple key in the repository's secrets it builds nothing and says so – never a red cross for a
# missing key.
#
# Secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID      the key's id (App Store Connect → Users and Access → Integrations → App Store Connect API)
#   ASC_ISSUER_ID   the issuer id above the keys there
#   ASC_KEY_P8      the whole content of the downloaded AuthKey_….p8 file
#   APPLE_TEAM_ID   the team id (developer.apple.com/account → Membership details)
#   DIST_KEY_PEM    optional: a private RSA key – its distribution certificate is kept at Apple (ios/ci/signing.rb)
#
# When (01.11.2026, the app's code is in main – one code for the website and the app):
#   - by hand: "Run workflow"
#   - a push to the branch app-release (git push origin main:app-release) – a build on purpose
#   - every night at 04:00 (German time), when main changed during the day – the testers get the day's state
# The shot detector's tests (native-plugins/shot-listener) run on every change to it, also without the key.
name: iOS app to TestFlight

on:
  push:
    branches: [app-release, main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

# Intel Macs: GitHub had no Apple-silicon Mac free for hours (02.11.2026, "not acquired by Runner") – an iPhone app
# builds the same on them
jobs:
  # the detector of the shot by sound – the website's tests, in Swift, on a Mac
  detector:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Changed?
        id: changed
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref_name }}" != "main" ] || git diff --name-only HEAD~1 HEAD | grep -q '^native-plugins/'; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.go == 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - if: steps.changed.outputs.go == 'true'
        # the errors as annotations – readable without signing in to GitHub (the log needs a login)
        run: swift test --package-path native-plugins/shot-listener > "$RUNNER_TEMP/swift.log" 2>&1 || { grep -E "error:|error |fatal|failed|Failed|XCTAssert|No profiles|No Account|provisioning|Signing" "$RUNNER_TEMP/swift.log" > "$RUNNER_TEMP/swift.log.err" || true; [ -s "$RUNNER_TEMP/swift.log.err" ] || tail -n 15 "$RUNNER_TEMP/swift.log" > "$RUNNER_TEMP/swift.log.err"; head -25 "$RUNNER_TEMP/swift.log.err" | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - if: always() && steps.changed.outputs.go == 'true'
        run: tail -n 80 "$RUNNER_TEMP/swift.log" || true

  # the app is built on its own – the detector's tests run beside it and say what fails
  testflight:
    # a push to main only tests the detector; the app is built by hand, from app-release and at night
    if: github.event_name != 'push' || github.ref_name == 'app-release'
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || github.ref }}
          fetch-depth: 50
      - name: The Apple key is there – and at night, did main change?
        id: ready
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::notice::No Apple key in the secrets yet (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, APPLE_TEAM_ID) – nothing built."
            echo "go=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ -z "$(git log --since='24 hours ago' --format=%h)" ]; then
            echo "::notice::main unchanged since yesterday – no new build."
            echo "go=false" >> "$GITHUB_OUTPUT"
          # at night: the app in main was built already in the evening (by hand or app-release; changes only to the
          # build's own files don't count) – no second build and no second mail from Apple
          elif [ "${{ github.event_name }}" = "schedule" ] && LAST=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ios.yml/runs?status=success&per_page=30" -q '[.workflow_runs[] | select(.event != "push" or .head_branch == "app-release")][0].head_sha' 2>/dev/null) && [ -n "$LAST" ] && git diff --quiet "$LAST" HEAD -- . ':!.github' ':!ios/ci' 2>/dev/null; then
            echo "::notice::the app in main is built already (${LAST:0:7}) – no new build."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.go == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Apple takes only builds made with the newest Xcode
      - if: steps.ready.outputs.go == 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - if: steps.ready.outputs.go == 'true'
        run: npm ci
      - if: steps.ready.outputs.go == 'true'
        run: npm test
      - if: steps.ready.outputs.go == 'true'
        run: npm run build
      - if: steps.ready.outputs.go == 'true'
        run: npx cap sync ios
      # Signed for the App Store from the start (02.11.2026: signed for development and handed to Apple's cloud to sign
      # again on export, the upload said "Invalid Signature"): this build's own Apple Distribution certificate and App
      # Store profile, made with the API key in a keychain of its own – removed at Apple again at the end. With the
      # secret DIST_KEY_PEM the certificate is a lasting one and stays (no "revoked" mail from Apple per build).
      - name: Signing for the App Store
        id: signing
        if: steps.ready.outputs.go == 'true'
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/keys/AuthKey.p8
          DIST_KEY_PEM: ${{ secrets.DIST_KEY_PEM }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys" "$RUNNER_TEMP/signing"
          printf '%s' "$ASC_KEY_P8" > "$ASC_KEY_PATH"
          ruby ios/ci/signing.rb setup "$RUNNER_TEMP/signing" > "$RUNNER_TEMP/signing/out.txt" || { cat "$RUNNER_TEMP/signing/out.txt"; echo "::error::No certificate or profile from Apple – see the log"; exit 1; }
          export PROFILE_NAME=$(sed -n 's/^PROFILE_NAME=//p' "$RUNNER_TEMP/signing/out.txt")
          PROFILE_UUID=$(sed -n 's/^PROFILE_UUID=//p' "$RUNNER_TEMP/signing/out.txt")
          echo "profile=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          sed -n 's/^CERTIFICATE=//p' "$RUNNER_TEMP/signing/out.txt" | while IFS= read -r l; do echo "::notice::certificate: $l"; done
          KC="$RUNNER_TEMP/signing/build.keychain-db"
          KCPW=$(openssl rand -hex 16)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/signing/key.pem" -k "$KC" -t priv -f openssl -T /usr/bin/codesign -T /usr/bin/security
          security import "$RUNNER_TEMP/signing/cert.cer" -k "$KC" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC" | head -3 | while IFS= read -r l; do echo "::notice::identity: $l"; done
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/signing/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          # only the app's Release build signs by hand (the Swift packages sign nothing); push for the App Store
          perl -0pi -e 's/(504EC3181FED79650016851F \/\* Release \*\/ = \{.*?)CODE_SIGN_STYLE = Automatic;/${1}CODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";\n\t\t\t\tDEVELOPMENT_TEAM = $ENV{APPLE_TEAM_ID};\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "$ENV{PROFILE_NAME}";/s' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' 's|<string>development</string>|<string>production</string>|' ios/App/App/App.entitlements
          grep -c 'CODE_SIGN_STYLE = Manual' ios/App/App.xcodeproj/project.pbxproj | while IFS= read -r l; do echo "::notice::manual signing in $l configuration(s), profile \"$PROFILE_NAME\""; done
      - name: Archive
        if: steps.ready.outputs.go == 'true'
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/signing/build.keychain-db" \
            archive > "$RUNNER_TEMP/archive.log" 2>&1 || { tail -n 60 "$RUNNER_TEMP/archive.log"; { grep -E "error:|error |fatal|failed|Failed|No profiles|No Account|provisioning|Signing" "$RUNNER_TEMP/archive.log" > "$RUNNER_TEMP/archive.log.err" || true; [ -s "$RUNNER_TEMP/archive.log.err" ] || tail -n 15 "$RUNNER_TEMP/archive.log" > "$RUNNER_TEMP/archive.log.err"; head -25 "$RUNNER_TEMP/archive.log.err" | while IFS= read -r l; do echo "::error::$l"; done; exit 1; } }
          tail -n 20 "$RUNNER_TEMP/archive.log"
          codesign -dvv "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" 2>&1 | grep -E "Authority=Apple Distribution|TeamIdentifier" | while IFS= read -r l; do echo "::notice::archived app: $l"; done || true
      - name: Upload to TestFlight
        if: steps.ready.outputs.go == 'true'
        run: |
          KEY="$RUNNER_TEMP/keys/AuthKey.p8"
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>de.moescheit.golfos</key><string>${{ steps.signing.outputs.profile }}</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" > "$RUNNER_TEMP/export.log" 2>&1 || { tail -n 40 "$RUNNER_TEMP/export.log"; { grep -E "error:|error |fatal|failed|Failed|No profiles|No Account|provisioning|Signing" "$RUNNER_TEMP/export.log" > "$RUNNER_TEMP/export.log.err" || true; [ -s "$RUNNER_TEMP/export.log.err" ] || tail -n 15 "$RUNNER_TEMP/export.log" > "$RUNNER_TEMP/export.log.err"; head -25 "$RUNNER_TEMP/export.log.err" | while IFS= read -r l; do echo "::error::$l"; done; exit 1; } }
          tail -n 20 "$RUNNER_TEMP/export.log"
          echo "::notice::Build $GITHUB_RUN_NUMBER uploaded – in TestFlight after Apple's processing (about 10–30 min)."
      - name: Remove the certificate, the profile and the key
        if: always() && steps.ready.outputs.go == 'true'
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/keys/AuthKey.p8
        run: |
          [ -f "$RUNNER_TEMP/signing/ids.json" ] && ruby ios/ci/signing.rb cleanup "$RUNNER_TEMP/signing" || true
          security delete-keychain "$RUNNER_TEMP/signing/build.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/keys" "$RUNNER_TEMP/signing"
