# Builds GolfOS as an iOS app and uploads it to TestFlight (Sascha 01.11.2026: no Mac – a Mac of GitHub builds and
# signs it). Without the Apple key in the repository's secrets it builds nothing and says so – never a red cross for a
# missing key.
#
# Secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID      the key's id (App Store Connect → Users and Access → Integrations → App Store Connect API)
#   ASC_ISSUER_ID   the issuer id above the keys there
#   ASC_KEY_P8      the whole content of the downloaded AuthKey_….p8 file
#   APPLE_TEAM_ID   the team id (developer.apple.com/account → Membership details)
#
# When (01.11.2026, the app's code is in main – one code for the website and the app):
#   - by hand: "Run workflow"
#   - a push to the branch app-release (git push origin main:app-release) – a build on purpose
#   - every night at 04:00 (German time), when main changed during the day – the testers get the day's state
# The shot detector's tests (native-plugins/shot-listener) run on every change to it, also without the key.
name: iOS app to TestFlight

on:
  push:
    branches: [app-release, main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  # the detector of the shot by sound – the website's tests, in Swift, on a Mac
  detector:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Changed?
        id: changed
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref_name }}" != "main" ] || git diff --name-only HEAD~1 HEAD | grep -q '^native-plugins/'; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.go == 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - if: steps.changed.outputs.go == 'true'
        # the errors as annotations – readable without signing in to GitHub (the log needs a login)
        run: swift test --package-path native-plugins/shot-listener > "$RUNNER_TEMP/swift.log" 2>&1 || { grep -E "error:|error |fatal|failed|Failed|XCTAssert|No profiles|No Account|provisioning|Signing" "$RUNNER_TEMP/swift.log" > "$RUNNER_TEMP/swift.log.err" || true; [ -s "$RUNNER_TEMP/swift.log.err" ] || tail -n 15 "$RUNNER_TEMP/swift.log" > "$RUNNER_TEMP/swift.log.err"; head -25 "$RUNNER_TEMP/swift.log.err" | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - if: always() && steps.changed.outputs.go == 'true'
        run: tail -n 80 "$RUNNER_TEMP/swift.log" || true

  # the app is built on its own – the detector's tests run beside it and say what fails
  testflight:
    # a push to main only tests the detector; the app is built by hand, from app-release and at night
    if: github.event_name != 'push' || github.ref_name == 'app-release'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || github.ref }}
          fetch-depth: 50
      - name: The Apple key is there – and at night, did main change?
        id: ready
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::notice::No Apple key in the secrets yet (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, APPLE_TEAM_ID) – nothing built."
            echo "go=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ -z "$(git log --since='24 hours ago' --format=%h)" ]; then
            echo "::notice::main unchanged since yesterday – no new build."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.go == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Apple takes only builds made with the newest Xcode
      - if: steps.ready.outputs.go == 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - if: steps.ready.outputs.go == 'true'
        run: npm ci
      - if: steps.ready.outputs.go == 'true'
        run: npm test
      - if: steps.ready.outputs.go == 'true'
        run: npm run build
      - if: steps.ready.outputs.go == 'true'
        run: npx cap sync ios
      # signed while archived – for development, so the team needs one registered iPhone (02.11.2026: archived unsigned,
      # the export did not sign it: "Invalid Signature"); the export signs it again for the App Store, by Apple's cloud
      - name: Archive, signed by Apple's cloud with the key
        if: steps.ready.outputs.go == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY="$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            "${AUTH[@]}" archive > "$RUNNER_TEMP/archive.log" 2>&1 || { tail -n 60 "$RUNNER_TEMP/archive.log"; { grep -E "error:|error |fatal|failed|Failed|XCTAssert|No profiles|No Account|provisioning|Signing" "$RUNNER_TEMP/archive.log" > "$RUNNER_TEMP/archive.log.err" || true; [ -s "$RUNNER_TEMP/archive.log.err" ] || tail -n 15 "$RUNNER_TEMP/archive.log" > "$RUNNER_TEMP/archive.log.err"; head -25 "$RUNNER_TEMP/archive.log.err" | while IFS= read -r l; do echo "::error::$l"; done; exit 1; } }
          tail -n 20 "$RUNNER_TEMP/archive.log"
          # how it was signed – as notices, readable without a login (the first TestFlight builds, 02.11.2026)
          grep -iE "Signing Identity|Provisioning Profile|cloud" "$RUNNER_TEMP/archive.log" | sort -u | head -8 | while IFS= read -r l; do echo "::notice::archive: $l"; done || true
          codesign -dvv "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" 2>&1 | grep -E "Authority|TeamIdentifier|Identifier=" | while IFS= read -r l; do echo "::notice::archived app: $l"; done || true
      - name: Upload to TestFlight
        if: steps.ready.outputs.go == 'true'
        run: |
          KEY="$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" > "$RUNNER_TEMP/export.log" 2>&1 || { tail -n 40 "$RUNNER_TEMP/export.log"; grep -iE "sign|certificate|profile|cloud|distribution|identity" "$RUNNER_TEMP/export.log" | grep -viE "Invalid Signature" | sort -u | head -15 | while IFS= read -r l; do echo "::notice::export: $l"; done; { grep -E "error:|error |fatal|failed|Failed|XCTAssert|No profiles|No Account|provisioning|Signing" "$RUNNER_TEMP/export.log" > "$RUNNER_TEMP/export.log.err" || true; [ -s "$RUNNER_TEMP/export.log.err" ] || tail -n 15 "$RUNNER_TEMP/export.log" > "$RUNNER_TEMP/export.log.err"; head -25 "$RUNNER_TEMP/export.log.err" | while IFS= read -r l; do echo "::error::$l"; done; exit 1; } }
          tail -n 20 "$RUNNER_TEMP/export.log"
          echo "::notice::Build $GITHUB_RUN_NUMBER uploaded – in TestFlight after Apple's processing (about 10–30 min)."
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
